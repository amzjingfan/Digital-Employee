name: Pull Request CI

# Runs the focused backend and frontend verification needed before merging.
# Triggers: pull requests targeting main, pushes to main, and manual dispatch.
# Credentials: none; all jobs use read-only repository access.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  backend:
    name: Backend TikTok checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/backend/uv.lock

      - name: Install uv
        run: python -m pip install uv

      - name: Install backend dependencies
        run: uv sync --extra dev --locked

      - name: Run Ruff
        run: >-
          uv run --locked ruff check
          app/api/tiktok.py
          app/tiktok/connector.py
          app/tiktok/official.py
          app/tiktok/release_evidence.py
          app/tiktok/release_gate.py
          app/tiktok/schema.py
          app/tiktok/service.py
          app/tiktok/shadow.py
          ../tests/backend/test_tiktok_connector_authorization.py
          ../tests/backend/test_tiktok_live_write_release_gate.py
          ../tests/backend/test_tiktok_release_evidence.py
          ../tests/backend/test_tiktok_shadow.py

      - name: Compile backend
        run: uv run --locked python -m compileall -q app

      - name: Check root test layout
        run: uv run --locked python ../tests/check_test_layout.py

      - name: Run TikTok regression tests
        run: >-
          uv run --locked pytest -c ../../pytest.ini -q
          ../tests/backend/test_tiktok_connector_authorization.py
          ../tests/backend/test_tiktok_live_write_release_gate.py
          ../tests/backend/test_tiktok_release_evidence.py
          ../tests/backend/test_tiktok_shadow.py
          ../tests/backend/test_tiktok_release_gate.py
          ../tests/backend/test_tiktok_official_oauth.py
          ../tests/backend/test_tiktok_mock_replay_tasks.py
          ../tests/backend/test_tiktok_mock_replay_execution.py
          ../tests/backend/test_tiktok_mock_replay.py
          ../tests/backend/test_tiktok_mock_exception_matrix.py
          ../tests/backend/test_tiktok_m2m_verification.py
          ../tests/backend/test_tiktok_business_unit.py

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/frontend-enterprise
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend-enterprise/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend configuration
        run: npm run config:check

      - name: Check frontend translations
        run: npm run i18n:check

      - name: Type-check frontend tests
        run: npm run test:typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
