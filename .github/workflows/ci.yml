name: Pull Request CI

# Runs the focused backend and frontend verification needed before merging.
# Triggers: pull requests targeting main, pushes to main, and manual dispatch.
# Credentials: none; all jobs use read-only repository access.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  backend:
    name: Backend TikTok checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source/backend/uv.lock

      - name: Install uv
        run: python -m pip install uv

      - name: Install backend dependencies
        run: uv sync --extra dev --locked

      - name: Run Ruff
        run: uv run --locked ruff check app tests

      - name: Compile backend
        run: uv run --locked python -m compileall -q app

      - name: Run TikTok regression tests
        run: uv run --locked pytest tests/test_tiktok*.py -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source/frontend-enterprise
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-enterprise/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build
